services:
  app:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DOCLING_BASE_URL=http://docling:5001
    depends_on:
      - docling
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pass-1 OCR engine (ADR-0032): born-digital text-layer extraction + OCR of
  # scanned/image documents + table reconstruction → markdown, over HTTP. CPU
  # image (models pre-baked), pinned to the version the adapter's /v1/convert
  # path was verified against. Swap to a docling-serve-cu*:<ver> tag for GPU.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.22.0
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  test:
    build:
      context: .
      target: test
    command: ["npm", "run", "test"]
    environment:
      - NODE_ENV=test
