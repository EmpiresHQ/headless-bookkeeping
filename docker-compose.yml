services:
  app:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pass-1 OCR has no sidecar (ADR-0032): born-digital PDFs are text-extracted
  # in-process (pdf-parse); images & scanned PDFs are OCR'd by an external
  # OpenAI-compatible vision endpoint (LiteLLM/dots.ocr) configured via admin
  # settings (ai_base_url / ai_api_key / ai_model.ocr). Scanned PDFs are
  # rasterised with poppler (pdftoppm), installed in the app image.

  test:
    build:
      context: .
      target: test
    command: ["npm", "run", "test"]
    environment:
      - NODE_ENV=test
