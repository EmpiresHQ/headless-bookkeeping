name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# New push to the same PR/branch cancels the previous run automatically.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.f.outputs.server }}
      web: ${{ steps.f.outputs.web }}
      cli: ${{ steps.f.outputs.cli }}
      ios: ${{ steps.f.outputs.ios }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            server:
              - *shared
              - 'packages/server/**'
            web:
              - *shared
              - 'packages/web/**'
            cli:
              - *shared
              - 'packages/cli/**'
            ios:
              - 'apps/ios/**'
              - '.github/workflows/ci.yml'

  # One workspace test image (full `npm ci` + builds) shared by every package's
  # test/lint jobs. Built whenever ANY package (or a shared root file) changed.
  build-test-image:
    runs-on: ubuntu-latest
    needs: changes
    if: >
      needs.changes.outputs.server == 'true'
      || needs.changes.outputs.web == 'true'
      || needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          target: test
          tags: app-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image to a tarball
        run: docker save app-test | gzip > app-test.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: app-test-image
          path: app-test.tar.gz
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    needs: [changes, build-test-image]
    if: needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-test-image
      - run: docker load < app-test.tar.gz
      - run: docker run --rm app-test npm run lint -w @headless-bookkeeping/server

  unit:
    runs-on: ubuntu-latest
    needs: [changes, build-test-image]
    if: needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-test-image
      - run: docker load < app-test.tar.gz
      - run: docker run --rm app-test npm run test -w @headless-bookkeeping/server

  e2e:
    runs-on: ubuntu-latest
    needs: [changes, build-test-image]
    if: needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-test-image
      - run: docker load < app-test.tar.gz
      - run: docker run --rm app-test npm run test:e2e -w @headless-bookkeeping/server

  web-check:
    runs-on: ubuntu-latest
    needs: [changes, build-test-image]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-test-image
      - run: docker load < app-test.tar.gz
      - run: docker run --rm app-test sh -c "npm run lint -w @headless-bookkeeping/web && npm run test -w @headless-bookkeeping/web"

  cli-test:
    runs-on: ubuntu-latest
    needs: [changes, build-test-image]
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-test-image
      - run: docker load < app-test.tar.gz
      - run: docker run --rm app-test sh -c "npm run lint -w @empireshq/hbk && npm run build -w @empireshq/hbk && npm test -w @empireshq/hbk"

  typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @headless-bookkeeping/server

  # iOS app cross-platform logic tests (swift-testing) on macOS. Runs only when the
  # iOS app changed. The heavy iOS device build (MLX + bundled model) lives in the
  # separate ios.yml workflow; this keeps the iOS unit tests in the main gate.
  ios-test:
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme AccountingHelper
      - name: Test on macOS
        run: |
          xcodebuild test \
            -scheme AccountingHelper \
            -destination 'platform=macOS' \
            -derivedDataPath .build-macos \
            CODE_SIGNING_ALLOWED=NO

  build-and-push:
    runs-on: ubuntu-latest
    needs: [changes, lint, unit, e2e, typecheck, web-check, cli-test]
    if: >
      github.event_name == 'push'
      && !cancelled()
      && !contains(needs.*.result, 'failure')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive registry host from DOCKER_IMAGE
        id: img
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
        run: echo "registry=${DOCKER_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.img.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy the just-pushed image to the VPS over SSH. Runs only on push (after
  # the image exists in the registry). `environment: production` lets you add
  # required reviewers / branch protection in repo settings to gate releases.
  #
  # Required repo secrets (in addition to DOCKER_IMAGE/USERNAME/PASSWORD):
  #   VPS_HOST       — VPS hostname or IP
  #   VPS_USER       — SSH user
  #   VPS_SSH_KEY    — private SSH key (PEM) authorized on the VPS
  #   VPS_PORT       — SSH port (optional, default 22)
  #   DEPLOY_PATH    — dir on the VPS holding deploy/.env (e.g. /opt/headless-bookkeeping)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'push' && !cancelled() && needs['build-and-push'].result == 'success' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Sync the deploy/ config to the VPS so the compose stays current.
      # The persistent deploy/.env and data on the VPS are NOT touched.
      - name: Copy deploy config to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/caddy/Dockerfile,deploy/README.md,deploy/.env.example
          target: ${{ secrets.DEPLOY_PATH }}
          # Strip the leading `deploy/` so files land flat in DEPLOY_PATH
          # (DEPLOY_PATH/docker-compose.yml, …), matching the remote script below.
          strip_components: 1

      - name: Pull image & restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DOCKER_IMAGE,DOCKER_USERNAME,DOCKER_PASSWORD,APP_IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            # Authenticate to the registry (registry host = part before the first "/").
            echo "$DOCKER_PASSWORD" | docker login "${DOCKER_IMAGE%%/*}" -u "$DOCKER_USERNAME" --password-stdin
            export APP_IMAGE_TAG
            # A function (not a string var) so args split correctly in any login
            # shell — the VPS uses zsh, which does NOT word-split unquoted "$VAR".
            dc() { docker compose -f docker-compose.yml --env-file .env "$@"; }
            dc pull app
            dc up -d --build --remove-orphans
            # Apply any Caddyfile changes without recreating the container.
            dc exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || true
            docker image prune -f
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          APP_IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
