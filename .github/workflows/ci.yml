name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t app-test .

      - name: Run lint
        run: docker run --rm app-test npm run lint

      - name: Run unit tests
        run: docker run --rm app-test npm run test

      - name: Run E2E tests
        run: docker run --rm app-test npm run test:e2e

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The registry host for login is the part of DOCKER_IMAGE before the first
      # "/" (e.g. registry.example.com from registry.example.com/headless-bookkeeping),
      # so we don't need a second secret that could drift out of sync.
      - name: Derive registry host from DOCKER_IMAGE
        id: img
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
        run: echo "registry=${DOCKER_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.img.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
