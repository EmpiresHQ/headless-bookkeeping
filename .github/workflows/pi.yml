# pi coding bot — triggered by `/pi` comments on issues and PRs.
#
# Runs entirely inside GitHub Actions via shaftoe/pi-coding-agent-action (a
# bundled JavaScript action — no install step, so no npm-lifecycle surprises).
# On an authorized `/pi` comment it runs the pi coding agent, edits code,
# opens/updates a PR and replies in a comment.
#
# Model: moonshotai/kimi-k2.6 via OpenRouter (OpenAI-compatible gateway).
# Required repo/org secret: OPENROUTER_API_KEY
#
# Action is pinned to a commit SHA (v2.18.0) per supply-chain hygiene — bump the
# SHA + trailing comment together when upgrading.

name: pi

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pi:
    runs-on: ubuntu-latest
    # Trigger + authorization. shaftoe's action has no built-in authz, so we
    # gate here: comment must start the `/pi` trigger AND the author must be a
    # repo owner, org member, or collaborator (matches the original intent).
    if: >-
      contains(github.event.comment.body, '/pi') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run pi coding agent
        uses: shaftoe/pi-coding-agent-action@e4df95b41f4e9eeea853d0ae947577485ffb20fd # v2.18.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger: '/pi'
          # --- LLM: kimi-k2.6 via OpenRouter (OpenAI-compatible) ---
          provider: openai
          model: moonshotai/kimi-k2.6
          base_url: https://openrouter.ai/api/v1
          token: ${{ secrets.OPENROUTER_API_KEY }}
          thinking_level: medium
