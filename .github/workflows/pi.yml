# pi coding bots — triggered by comments on issues and PRs.
#
# Three agents, one job each. A matrix can't be used: GitHub does not allow the
# `matrix` context in a job-level `if:`, and moving the trigger check to a step
# would boot a runner for every agent on every comment. With one job per agent
# gated by a literal trigger, a job is skipped (no runner) unless its phrase
# appears — so ordinary comments cost nothing.
#   @pi      → DeepSeek V4 Flash         (cheap, fast, no reasoning)
#   @superpi → Kimi K2.6                 (premium, reasoning on)
#   @cheapi  → Qwen3 235B A22B          (cheapest still-capable; cheaper than @pi)
#
# No trigger is a substring of another (@superpi / @cheapi do not contain @pi),
# so a single comment routes to exactly one agent.
#
# Each run exports the agent session as a self-contained HTML transcript,
# uploads it as a downloadable artifact, and writes a metrics + response
# summary to the run's Summary tab (the action does not post these itself).
#
# Runs via shaftoe/pi-coding-agent-action (bundled JS action — no install step).
# All models use pi's built-in `openrouter` provider.
# Required repo/org secret: OPENROUTER_API_KEY
# Action pinned to a commit SHA (v2.18.0) — bump SHA + comment together.

name: pi

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Cheap default agent.
  pi:
    if: >-
      contains(github.event.comment.body, '@pi') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 16 # backstop; the agent step itself is capped at 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Inline PR-review comments → check out the PR head so the agent edits
          # the PR's code. Issues / plain comments → empty ref → default branch
          # (main). The agent reads/edits files locally; commits go via the API.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run pi coding agent
        id: agent
        timeout-minutes: 15 # kill a hung/runaway agent so it can't burn Actions minutes
        uses: shaftoe/pi-coding-agent-action@e4df95b41f4e9eeea853d0ae947577485ffb20fd # v2.18.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger: '@pi'
          provider: openrouter
          model: deepseek/deepseek-v4-flash
          token: ${{ secrets.OPENROUTER_API_KEY }}
          thinking_level: 'off'
          export_session_html: true
      - name: Write run summary
        if: always()
        env:
          PI_LABEL: '@pi · deepseek-v4-flash'
          PI_SUCCESS: ${{ steps.agent.outputs.success }}
          PI_COST: ${{ steps.agent.outputs.cost }}
          PI_IN: ${{ steps.agent.outputs.input_tokens }}
          PI_OUT: ${{ steps.agent.outputs.output_tokens }}
          PI_DUR: ${{ steps.agent.outputs.duration_seconds }}
          PI_RESPONSE: ${{ steps.agent.outputs.response }}
        run: |
          {
            echo "### ${PI_LABEL}"
            echo "success=\`${PI_SUCCESS:-?}\` · cost=\`\$${PI_COST:-?}\` · tokens in/out=\`${PI_IN:-?}/${PI_OUT:-?}\` · \`${PI_DUR:-?}s\`"
            echo
            echo '<details><summary>agent response</summary>'
            echo
            printf '%s\n' "${PI_RESPONSE:-(no response output)}"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload session transcript
        if: always() && steps.agent.outputs.session_html_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: pi-session-${{ github.run_id }}-${{ github.job }}
          path: ${{ steps.agent.outputs.session_html_path }}
          if-no-files-found: ignore

  # Premium agent — kimi with reasoning, opt-in via @superpi.
  superpi:
    if: >-
      contains(github.event.comment.body, '@superpi') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 16 # backstop; the agent step itself is capped at 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Inline PR-review comments → check out the PR head so the agent edits
          # the PR's code. Issues / plain comments → empty ref → default branch
          # (main). The agent reads/edits files locally; commits go via the API.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run pi coding agent
        id: agent
        timeout-minutes: 15 # kill a hung/runaway agent so it can't burn Actions minutes
        uses: shaftoe/pi-coding-agent-action@e4df95b41f4e9eeea853d0ae947577485ffb20fd # v2.18.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger: '@superpi'
          provider: openrouter
          model: moonshotai/kimi-k2.6
          token: ${{ secrets.OPENROUTER_API_KEY }}
          thinking_level: medium
          export_session_html: true
      - name: Write run summary
        if: always()
        env:
          PI_LABEL: '@superpi · kimi-k2.6'
          PI_SUCCESS: ${{ steps.agent.outputs.success }}
          PI_COST: ${{ steps.agent.outputs.cost }}
          PI_IN: ${{ steps.agent.outputs.input_tokens }}
          PI_OUT: ${{ steps.agent.outputs.output_tokens }}
          PI_DUR: ${{ steps.agent.outputs.duration_seconds }}
          PI_RESPONSE: ${{ steps.agent.outputs.response }}
        run: |
          {
            echo "### ${PI_LABEL}"
            echo "success=\`${PI_SUCCESS:-?}\` · cost=\`\$${PI_COST:-?}\` · tokens in/out=\`${PI_IN:-?}/${PI_OUT:-?}\` · \`${PI_DUR:-?}s\`"
            echo
            echo '<details><summary>agent response</summary>'
            echo
            printf '%s\n' "${PI_RESPONSE:-(no response output)}"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload session transcript
        if: always() && steps.agent.outputs.session_html_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: pi-session-${{ github.run_id }}-${{ github.job }}
          path: ${{ steps.agent.outputs.session_html_path }}
          if-no-files-found: ignore

  # Budget agent — cheapest still-capable model. (Was deepseek-flash:free, but
  # the free tier is rate-limited upstream / returns 429.) Qwen3 235B is a
  # flagship-class MoE at ~$0.07/$0.10 per Mtok — cheaper than @pi on both axes.
  cheapi:
    if: >-
      contains(github.event.comment.body, '@cheapi') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 16 # backstop; the agent step itself is capped at 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Inline PR-review comments → check out the PR head so the agent edits
          # the PR's code. Issues / plain comments → empty ref → default branch
          # (main). The agent reads/edits files locally; commits go via the API.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run pi coding agent
        id: agent
        timeout-minutes: 15 # kill a hung/runaway agent so it can't burn Actions minutes
        uses: shaftoe/pi-coding-agent-action@e4df95b41f4e9eeea853d0ae947577485ffb20fd # v2.18.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger: '@cheapi'
          provider: openrouter
          model: qwen/qwen3-235b-a22b-2507
          token: ${{ secrets.OPENROUTER_API_KEY }}
          thinking_level: 'off'
          export_session_html: true
      - name: Write run summary
        if: always()
        env:
          PI_LABEL: '@cheapi · qwen3-235b-a22b-2507'
          PI_SUCCESS: ${{ steps.agent.outputs.success }}
          PI_COST: ${{ steps.agent.outputs.cost }}
          PI_IN: ${{ steps.agent.outputs.input_tokens }}
          PI_OUT: ${{ steps.agent.outputs.output_tokens }}
          PI_DUR: ${{ steps.agent.outputs.duration_seconds }}
          PI_RESPONSE: ${{ steps.agent.outputs.response }}
        run: |
          {
            echo "### ${PI_LABEL}"
            echo "success=\`${PI_SUCCESS:-?}\` · cost=\`\$${PI_COST:-?}\` · tokens in/out=\`${PI_IN:-?}/${PI_OUT:-?}\` · \`${PI_DUR:-?}s\`"
            echo
            echo '<details><summary>agent response</summary>'
            echo
            printf '%s\n' "${PI_RESPONSE:-(no response output)}"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload session transcript
        if: always() && steps.agent.outputs.session_html_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: pi-session-${{ github.run_id }}-${{ github.job }}
          path: ${{ steps.agent.outputs.session_html_path }}
          if-no-files-found: ignore
