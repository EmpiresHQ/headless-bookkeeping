# Releases the @empireshq/hbk CLI to the private Verdaccio registry
# (https://npm.empireshq.com) + a GitHub Release.
#
# PAUSED: trigger is manual (workflow_dispatch) for now. To re-enable automatic
# diff-driven releases, restore the `push` trigger below (commented out).
#
# Versioning is registry-driven: the next version is computed from the latest
# version already in the registry, so it never collides and nothing is committed
# back to `main`. The tag + GitHub Release are created at the current commit.
#
# Prerequisites before running:
#   - Repo secret NPM_TOKEN = a Verdaccio auth token (the value of
#     //npm.empireshq.com/:_authToken in ~/.npmrc after `npm login` — see README).

name: cli-release

on:
  workflow_dispatch:
  # Re-enable diff-driven auto-release by uncommenting:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'packages/cli/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.empireshq.com
          scope: '@empireshq'
          cache: npm
      - run: npm ci
      # Generate the OpenAPI spec fresh from the current server code (offline
      # Nest emit) so the published CLI always matches the running API. The spec
      # is NOT committed — it only exists as a build artifact bundled at publish.
      - name: Generate OpenAPI spec from the server
        run: |
          mkdir -p data
          npm run cli:codegen
      - run: npm run build -w @empireshq/hbk
      - run: npm test -w @empireshq/hbk

      - name: Decide semver bump from commit message
        id: bump
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if echo "$MSG" | grep -q '\[major\]'; then echo "level=major" >> "$GITHUB_OUTPUT";
          elif echo "$MSG" | grep -q '\[minor\]'; then echo "level=minor" >> "$GITHUB_OUTPUT";
          else echo "level=patch" >> "$GITHUB_OUTPUT"; fi

      - name: Determine version from the registry
        id: version
        working-directory: packages/cli
        run: |
          # Registry is the source of truth: align package.json to the latest
          # published version, then bump from there. Avoids "version already
          # exists" collisions and needs no commit back to main. Read the result
          # from package.json via `node -p` (never capture npm's noisy stdout).
          CUR="$(npm view @empireshq/hbk version --registry https://npm.empireshq.com 2>/dev/null || echo 0.0.0)"
          npm version "$CUR" --allow-same-version --no-git-tag-version >/dev/null 2>&1
          npm version "${{ steps.bump.outputs.level }}" --no-git-tag-version >/dev/null 2>&1
          NEW="$(node -p "require('./package.json').version")"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Releasing @empireshq/hbk@$NEW (was $CUR)"

      - name: Publish to the private registry
        working-directory: packages/cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hbk-${{ steps.version.outputs.version }}" \
            --title "hbk ${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --notes "Auto-release of @empireshq/hbk@${{ steps.version.outputs.version }} to the private registry."
