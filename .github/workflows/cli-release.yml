# Releases the @empireshq/hbk CLI to the private Verdaccio registry
# (https://npm.empireshq.com) + a GitHub Release.
#
# PAUSED: trigger is manual (workflow_dispatch) for now. To re-enable automatic
# diff-driven releases, restore the `push` trigger below (commented out).
#
# Prerequisites before running:
#   - Repo secret NPM_TOKEN = a Verdaccio auth token (the value of
#     //npm.empireshq.com/:_authToken in ~/.npmrc after `npm login` — see README).
#   - This workflow pushes a version-bump commit + tag back to `main`. If `main`
#     is a protected branch, allow the actions bot to push (or use a PAT/deploy key).

name: cli-release

on:
  workflow_dispatch:
  # Re-enable diff-driven auto-release by uncommenting:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'packages/cli/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.empireshq.com
          scope: '@empireshq'
          cache: npm
      - run: npm ci
      # Generate the OpenAPI spec fresh from the current server code (offline
      # Nest emit) so the published CLI always matches the running API. The spec
      # is NOT committed — it only exists as a build artifact bundled at publish.
      - name: Generate OpenAPI spec from the server
        run: |
          mkdir -p data
          npm run cli:codegen
      - run: npm run build -w @empireshq/hbk
      - run: npm test -w @empireshq/hbk

      - name: Decide semver bump from commit message
        id: bump
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if echo "$MSG" | grep -q '\[major\]'; then echo "level=major" >> "$GITHUB_OUTPUT";
          elif echo "$MSG" | grep -q '\[minor\]'; then echo "level=minor" >> "$GITHUB_OUTPUT";
          else echo "level=patch" >> "$GITHUB_OUTPUT"; fi

      - name: Bump version
        id: version
        working-directory: packages/cli
        run: |
          # tail -n1: npm may emit warnings on stdout; the version is the last line.
          NEW="$(npm version ${{ steps.bump.outputs.level }} --no-git-tag-version | tail -n1)"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Publish to the private registry
        working-directory: packages/cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          git commit -m "chore(cli): release ${{ steps.version.outputs.version }} [skip ci]"
          git tag "hbk-${{ steps.version.outputs.version }}"
          git push --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hbk-${{ steps.version.outputs.version }}" \
            --title "hbk ${{ steps.version.outputs.version }}" \
            --notes "Auto-release of @empireshq/hbk. API surface reflects the current OpenAPI spec (packages/cli/openapi.json)."
