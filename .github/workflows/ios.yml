name: iOS

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ios

jobs:
  # Build for the iOS Simulator and run the full test suite. The simulator build
  # compiles the `#if os(iOS)` code (PhotoKit / Vision / CoreML / Keychain /
  # AVFoundation / SwiftUI) that the macOS host build excludes, and runs both the
  # cross-platform logic tests and the SIMULATOR-ONLY tests. Tests are written in
  # swift-testing; `xcodebuild test` on full Xcode runs them natively.
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme AccountingHelper

      - name: Build & test on iOS Simulator
        run: |
          xcodebuild test \
            -scheme AccountingHelper \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath .build-ios \
            CODE_SIGNING_ALLOWED=NO

  # Pure compile gate for a real iOS device slice (arm64), no code signing.
  # Catches device-only build differences the simulator (x86_64/arm64-sim) misses.
  device-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme AccountingHelper

      - name: Build for generic iOS device
        run: |
          xcodebuild build \
            -scheme AccountingHelper \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build-device \
            CODE_SIGNING_ALLOWED=NO
