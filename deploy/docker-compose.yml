# Production deploy: Cloudflare (DNS/proxy) → Caddy (TLS) → app, all sharing a
# Tailscale sidecar's network namespace so the whole stack is one tailnet node.
#
#   client → Cloudflare (your domain) → :443 (Caddy, TLS via CF DNS-01)
#                                        → localhost:3000 (app)
#
# The `tailscale` sidecar owns the network namespace and publishes :80/:443.
# `caddy` and `app` join it via network_mode: service:tailscale, so:
#   • Caddy reaches the app at localhost:3000 (single node), and
#   • the whole stack is reachable/administered over the tailnet, and
#   • in a SPLIT setup, Caddy can reverse_proxy to a private app node's tailnet
#     IP (set APP_UPSTREAM=100.x.y.z:3000 and run only the app+tailscale pair
#     on that private node).
#
# Usage (repo root, after one-time setup in README):
#   cp deploy/.env.example deploy/.env   # SITE_DOMAIN, CF_API_TOKEN, TS_AUTHKEY, DOCKER_IMAGE
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-headless-bookkeeping}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    # Public ingress for the whole stack lives here (the netns owner). Behind
    # Cloudflare these are the origin ports; firewall them to CF IP ranges.
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped

  caddy:
    # Custom image: caddy:2 + the Cloudflare DNS plugin (see caddy/Dockerfile).
    build:
      context: ./caddy
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - app
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
      # Single node: localhost:3000 (shared netns). Split: <app-node-tailnet-ip>:3000.
      - APP_UPSTREAM=${APP_UPSTREAM:-localhost:3000}
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  app:
    # Prebuilt image from the registry (CI builds & pushes on push to main). The
    # VPS only pulls — never builds the app. APP_IMAGE_TAG is set by the deploy
    # workflow to the exact commit SHA; defaults to latest for manual runs.
    image: ${DOCKER_IMAGE}:${APP_IMAGE_TAG:-latest}
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - NODE_ENV=production
    volumes:
      # Hash-chained ledger (app.sqlite) + uploaded documents. The ONE thing to
      # back up. Resolved next to this compose file → DEPLOY_PATH/data on the VPS.
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  tailscale_state:
