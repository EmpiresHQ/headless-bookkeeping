# Private deploy, mirroring the house pattern (cf. cpu-llm on the same host):
#
#   Caddy (TLS via CF DNS-01) shares the Tailscale sidecar's network namespace
#   and listens on :443 — reachable on the sidecar's TAILNET IP (100.x). `app`
#   sits on an internal bridge; Caddy reverse-proxies to app:3000 by name.
#
#   NOTHING is published on the host (no clash with Traefik on 80/443). Point a
#   Cloudflare A record at the sidecar's 100.x (DNS-only / grey cloud): the
#   domain resolves to the tailnet IP, Caddy serves a real cert there, and only
#   tailnet devices can route to it — public domain + valid TLS, private reach.
#
# Usage (from DEPLOY_PATH, after one-time setup in README):
#   docker compose --env-file .env up -d --build
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-headless-bookkeeping}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-headless-bookkeeping}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    networks:
      - internal

  caddy:
    # caddy:2 + the Cloudflare DNS plugin (see caddy/Dockerfile). Shares the
    # tailscale netns so it serves on the tailnet IP and can resolve `app` on
    # the internal bridge (the tailscale container is attached to it).
    build:
      context: ./caddy
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - SITE_DOMAIN=${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - tailscale
    network_mode: service:tailscale
    restart: unless-stopped

  app:
    # Prebuilt image from the registry (CI builds & pushes on push to main). The
    # VPS only pulls. APP_IMAGE_TAG is set by the deploy workflow to the commit
    # SHA; defaults to latest for manual runs.
    image: ${DOCKER_IMAGE}:${APP_IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      # 32-byte hex key that encrypts stored mailbox credentials at rest
      # (email intake). Required to add any mailbox connector — without it the
      # API 500s on connect. Generate once: `openssl rand -hex 32`. See README §9.
      - MAILBOX_SECRET_KEY=${MAILBOX_SECRET_KEY}
    volumes:
      # Hash-chained ledger (app.sqlite) + uploaded documents. The ONE thing to
      # back up. Resolved next to this compose file → DEPLOY_PATH/data on the VPS.
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    name: headless-accounting-internal
    driver: bridge

volumes:
  tailscale_state:
  caddy_data:
  caddy_config:
